name: Vprofile CICD workflow

on: 
  push:
    branches: 
      - main
      - dev

jobs:
  Build:
  runs on: ubuntu-latest
  steps:
    - name: code checkout
    - uses: actions/checkoutv@4

    - name: maven build
    - run: mvn install
  
Testing:
  runs-on: ubuntu-latest
  needs: Build
  steps:
    - name: code checkout
    - uses: actions/checkout@v4

    - name: run test on main branch
    - run: mvn test

    - name: checkstyle
    - run: mvc checkstyle:checksyle
